name: Check upstream versions

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compare.outputs.matrix }}
      has_updates: ${{ steps.compare.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install nvchecker
        run: pip install nvchecker

      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nvchecker -c .github/nvchecker.toml

      - name: Compare versions and build matrix
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bump PRs still open (e.g. failing CI) are left alone so that fixes
          # pushed to them by hand are not overwritten by the next run.
          OPEN_BRANCHES=$(gh pr list --state open --limit 200 --json headRefName --jq '.[].headRefName')
          export OPEN_BRANCHES

          MATRIX=$(python3 -c "
          import glob, json, os, re, sys, tomllib

          with open('.github/new_ver.json') as f:
              raw_new = json.load(f)
          with open('.github/nvchecker.toml', 'rb') as f:
              config = tomllib.load(f)
          config.pop('__config__', None)
          open_branches = os.environ.get('OPEN_BRANCHES', '').split()

          # nvchecker v2 format: {version: 2, data: {atom: {version: '...'}}}
          if 'data' in raw_new:
              new = {k: v['version'] for k, v in raw_new['data'].items()}
          else:
              new = raw_new

          def vkey(version):
              return [int(n) for n in re.findall('[0-9]+', version)]

          updates = []
          for atom, new_ver in new.items():
              category, name = atom.split('/')
              # Compare against the ebuild in the repo rather than old_ver.json:
              # old_ver.json advances even when a bump fails (download error,
              # PR closed unmerged), which used to drop that bump for good.
              ebuilds = glob.glob(f'{atom}/{name}-[0-9]*.ebuild')
              if not ebuilds:
                  print(f'{atom}: no ebuild found, skipping', file=sys.stderr)
                  continue
              old_ver = max((os.path.basename(e)[len(name) + 1:-len('.ebuild')] for e in ebuilds), key=vkey)
              if vkey(new_ver) <= vkey(old_ver):
                  continue
              branch_prefix = f'update/{name}-'
              if any(b.startswith(branch_prefix) and b[len(branch_prefix):][:1].isdigit() for b in open_branches):
                  print(f'{atom}: {new_ver} available, but a bump PR is already open', file=sys.stderr)
                  continue
              pkg = config.get(atom, {})
              gh = pkg.get('github', '')
              gl = pkg.get('gitlab', '')
              prefix = pkg.get('prefix', '')
              if gh:
                  url = f'https://github.com/{gh}/releases/tag/{prefix}{new_ver}'
              elif gl:
                  url = f'https://gitlab.com/{gl}/-/releases/{prefix}{new_ver}'
              else:
                  url = ''
              updates.append({
                  'atom': atom,
                  'category': category,
                  'name': name,
                  'old_version': old_ver,
                  'new_version': new_ver,
                  'release_url': url,
              })
          print(json.dumps({'include': updates}, separators=(',', ':')))
          ")

          if [ "$MATRIX" = '{"include":[]}' ]; then
            echo "All packages are up to date"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Update old_ver.json
        run: |
          python3 -c "
          import json
          with open('.github/old_ver.json') as f:
              old = json.load(f)
          with open('.github/new_ver.json') as f:
              raw_new = json.load(f)

          # nvchecker v2 format: {version: 2, data: {atom: {version: '...'}}}
          if 'data' in raw_new:
              new = {k: v['version'] for k, v in raw_new['data'].items()}
          else:
              new = raw_new

          old.update(new)
          with open('.github/old_ver.json', 'w') as f:
              json.dump(old, f, indent=2, sort_keys=True)
              f.write('\n')
          "

      - name: Generate app token
        id: app-token-oldver
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit old_ver.json
        id: create-pr-oldver
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-oldver.outputs.token }}
          author: diodonfrost-bot-gentoo-overlay[bot] <270583476+diodonfrost-bot-gentoo-overlay[bot]@users.noreply.github.com>
          committer: diodonfrost-bot-gentoo-overlay[bot] <270583476+diodonfrost-bot-gentoo-overlay[bot]@users.noreply.github.com>
          commit-message: "chore: update old_ver.json with latest upstream versions"
          branch: chore/update-old-ver
          title: "chore: update old_ver.json"
          body: "Auto-update known versions after nvchecker check."
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr-oldver.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token-oldver.outputs.token }}
          pull-request-number: ${{ steps.create-pr-oldver.outputs.pull-request-number }}
          merge-method: squash

  create-pr:
    needs: detect-updates
    if: needs.detect-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-updates.outputs.matrix) }}
      fail-fast: false
      max-parallel: 5
    steps:
      - uses: actions/checkout@v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Bump ebuild version
        id: bump
        run: |
          PKG_DIR="${{ matrix.category }}/${{ matrix.name }}"
          NEW_EBUILD="${PKG_DIR}/${{ matrix.name }}-${{ matrix.new_version }}.ebuild"

          # Start from the ebuild actually on master, not old_ver.json's
          # version: old_ver.json is updated even when a bump PR is still
          # pending, so the two drift apart and the old ebuild goes missing.
          OLD_EBUILD=$(ls "${PKG_DIR}/${{ matrix.name }}"-[0-9]*.ebuild | sort -V | tail -n 1)
          OLD_VERSION=$(basename "${OLD_EBUILD}" .ebuild)
          echo "old_version=${OLD_VERSION#${{ matrix.name }}-}" >> "$GITHUB_OUTPUT"

          if [ "${OLD_EBUILD}" = "${NEW_EBUILD}" ]; then
            echo "${NEW_EBUILD} already exists"
            exit 0
          fi

          cp "${OLD_EBUILD}" "${NEW_EBUILD}"
          rm "${OLD_EBUILD}"

      - name: Generate Manifest
        run: |
          python3 .github/scripts/generate-manifest.py \
            "${{ matrix.category }}/${{ matrix.name }}/${{ matrix.name }}-${{ matrix.new_version }}.ebuild"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: diodonfrost-bot-gentoo-overlay[bot] <270583476+diodonfrost-bot-gentoo-overlay[bot]@users.noreply.github.com>
          committer: diodonfrost-bot-gentoo-overlay[bot] <270583476+diodonfrost-bot-gentoo-overlay[bot]@users.noreply.github.com>
          branch: "update/${{ matrix.name }}-${{ matrix.new_version }}"
          commit-message: "feat(${{ matrix.name }}): version bump to ${{ matrix.new_version }}"
          title: "Update ${{ matrix.name }} to ${{ matrix.new_version }}"
          body: |
            ## Summary
            - Bumps **${{ matrix.atom }}** from `${{ steps.bump.outputs.old_version }}` to `${{ matrix.new_version }}`
            - Upstream release: ${{ matrix.release_url }}

            ## Test plan
            - [ ] `just test-lint` passes (pkgcheck QA)
            - [ ] `just test-build ${{ matrix.category }}/${{ matrix.name }}-${{ matrix.new_version }}` succeeds

            _Automated version bump by version-check workflow_
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash
